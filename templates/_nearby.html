<section id="nearby" class="section section--deep nearby" aria-labelledby="nearby-title">
  <div class="wrap">
    <div class="section-head section-head--end">
      <div class="section-head__title">
        $folio
        <h2 id="nearby-title" class="h2">$heading</h2>
      </div>
      <div class="section-head__aside">
        $subline
      </div>
    </div>
    $route
    $hint
    <div class="nearby__groups">$groups</div>
    $footnote
  </div>
</section>
