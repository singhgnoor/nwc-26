<section id="hero" class="hero" aria-labelledby="hero-title">
  $eyebrow
  <h1 id="hero-title" class="hero__title">
    <span class="hero__name-devanagari">$name_devanagari</span>
    <span class="hero__name-latin">$name_latin</span>
    <span class="hero__name-full">$name_full</span>
  </h1>
  <p class="hero__tagline">$tagline</p>
  <p class="hero__theme">$theme</p>
  <p class="hero__when-where"><time datetime="$start_date">$dates</time> <span aria-hidden="true">·</span> $venue</p>
  <p class="hero__cta"><a href="#programme">$view_programme</a></p>
  <div class="hero-art" aria-hidden="true">
    <!-- Hero art: flat SVG landscape (Shivalik foothills, Sutlej, sun) with the four IIT Ropar gate pillars, from the Figma file. -->
  </div>
</section>
