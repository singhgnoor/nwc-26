<section id="hero" class="hero" aria-labelledby="hero-title">
  <div class="wrap hero__inner">
    <div class="hero__text">
      $eyebrow
      <h1 id="hero-title" class="hero__title">
        <span class="hero__name"><span class="hero__name-word">$name_devanagari</span> <span class="hero__name-year">$year</span></span>
        <span class="hero__latin">$name_latin</span>
        <span class="hero__full">$name_full</span>
      </h1>
      <p class="hero__tagline">$diamond$tagline</p>
      <p class="hero__theme-label">$theme_label</p>
      <p class="hero__theme">$theme</p>
      <p class="hero__cta"><a class="btn btn--primary" href="#programme">$cta$icon_down</a></p>
    </div>
  </div>
  <div class="hero-art" aria-hidden="true">
    $art
  </div>
  $caption
</section>
