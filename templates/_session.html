<li class="programme__item">
  <details class="session" id="session-$id" data-type="$type">
    <summary class="session__summary">
      $time
      $tag
      $number
      <span class="session__title">$title</span>
      $subtitle
    </summary>
    <div class="session__body">
      $brief
      $outcomes
      $venue
      $groups
      $people
    </div>
  </details>
</li>
