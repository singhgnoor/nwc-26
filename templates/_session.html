<details class="session" id="details-$id" data-type="$type">
  <summary class="session__summary">
    <span class="session__heading">
      $meta
      <span class="session__title">$title</span>
    </span>
    <span class="session__actions">
      $hint
      $stack
      <span class="session__toggle" aria-hidden="true">$toggle</span>
    </span>
  </summary>
  <div class="session__body">
    $body
  </div>
</details>
</li>
