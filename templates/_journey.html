<section id="journey" class="section section--indigo journey" aria-labelledby="journey-title">
  <div class="wrap">
    <div class="section-head">
      <div class="section-head__title">
        $folio
        <h2 id="journey-title" class="h1">$heading</h2>
      </div>
      <div class="section-head__aside">
        $intro
      </div>
    </div>
    $stats
    <div class="ascent">
      $profile
      <ol class="milestones" role="list">$milestones</ol>
    </div>
  </div>
</section>
