<div class="carousel" role="region" aria-roledescription="carousel" aria-label="$label" data-carousel>
  <div class="carousel__stage">
    <ul class="carousel__track" role="list" data-carousel-track tabindex="0">$slides</ul>
    <button class="carousel__arrow carousel__arrow--prev" type="button" aria-label="$previous" data-carousel-prev hidden>$icon_arrow</button>
    <button class="carousel__arrow carousel__arrow--next" type="button" aria-label="$next" data-carousel-next hidden>$icon_arrow</button>
  </div>
  <ul class="carousel__thumbs" role="list">$thumbs</ul>
</div>
