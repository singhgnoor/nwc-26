<header class="site-header">
  <div class="site-header__logos">
    <!-- Organiser logos (MMTTP; Government of India emblem with the MoE / DoHE lockup; IIT Ropar seal) render here from the "logos" list in content/content.en.json. -->
$logos
  </div>
  <p class="site-header__brand"><a href="#hero">$brand</a></p>
  <nav class="site-nav" aria-label="$nav_label">
    <ul>
$nav_items
    </ul>
  </nav>
  <div class="site-header__lang">
    <!-- Language toggle (EN | हिन्दी): appears here automatically once content/content.hi.json exists. -->
$lang_toggle
  </div>
</header>
