<section id="glance" class="glance" aria-labelledby="glance-title">
  <h2 id="glance-title" class="visually-hidden">$heading</h2>
  <div class="wrap glance__inner">
    <div class="glance__item">
      $icon_calendar
      <div>
        <p class="glance__label">$dates_label</p>
        <p class="glance__value"><time datetime="$start_date">$dates</time></p>
        <p class="glance__note">$dates_note</p>
      </div>
    </div>
    <div class="glance__item">
      $icon_pin
      <div>
        <p class="glance__label">$venue_label</p>
        <p class="glance__value">$venue</p>
        <p class="glance__note">$venue_note</p>
      </div>
    </div>
    <div class="glance__countdown" data-countdown data-start="$start" data-end="$end" $day_attrs data-label-days="$label_days" data-label-day="$label_day" data-label-live="$label_live">
      <p class="visually-hidden">$countdown_label</p>
      <p class="countdown" aria-live="polite"><span class="countdown__num" data-countdown-num>$static_num</span> <span class="countdown__text" data-countdown-text>$static_text</span></p>
    </div>
  </div>
</section>
