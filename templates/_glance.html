<section id="glance" class="glance" aria-labelledby="glance-title">
  <h2 id="glance-title">$heading</h2>
  <dl class="glance__list">
    <div class="glance__item"><dt>$dates_label</dt><dd><time datetime="$start_date">$dates</time></dd></div>
    <div class="glance__item"><dt>$venue_label</dt><dd>$venue</dd></div>
    <div class="glance__item"><dt>$countdown_label</dt><dd><time class="countdown" datetime="$start_datetime" data-countdown data-end="$end_datetime" data-label-days="$label_days" data-label-day="$label_day" data-label-live="$label_live" data-label-over="$label_over">$start_text</time></dd></div>
  </dl>
</section>
