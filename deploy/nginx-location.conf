# nginx snippet for IT: add inside the existing `server { ... }` block for iitrpr.ac.in
# (the same place as the /zeitgeist/ location). Then: nginx -t && systemctl reload nginx
#
# - The first block sends /national-wellbeing-conclave-2026 (no slash) to the version with the slash.
#   The Python server does the same, so either alone is enough; keeping both is harmless.
# - proxy_pass has NO path after the port, so nginx passes the full path (prefix included);
#   server.py strips the prefix itself.
# - A future Hindi version at /national-wellbeing-conclave-2026/hi/ needs NO change here.
# - If this server process runs on a different machine from nginx, replace 127.0.0.1 with that
#   machine's address, set NWC_HOST on it accordingly, and firewall port 8100 so only nginx can reach it.
# - HSTS and TLS settings stay as they are for iitrpr.ac.in; the portal does not set them.

location = /national-wellbeing-conclave-2026 { return 301 /national-wellbeing-conclave-2026/; }
location /national-wellbeing-conclave-2026/ {
    proxy_pass http://127.0.0.1:8100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
